version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: sitegen_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: sitegenerator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sitegen_network

  # Redis (Celery + Channels)
  redis:
    image: redis:7-alpine
    container_name: sitegen_redis
    # Port mapping commented out - Redis only needs to be accessible within Docker network
    # Uncomment if you need to access Redis from host machine:
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sitegen_network

  # Django Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sitegen_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/static
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      SECRET_KEY: "dev-secret-key-change-in-production-12345678"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,0.0.0.0,144.124.224.234"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://144.124.224.234:5173"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/sitegenerator"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sitegen_network
    restart: unless-stopped

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sitegen_celery
    command: celery -A backend worker -l info
    volumes:
      - ./backend:/app
      - media_files:/app/media
    environment:
      DEBUG: "1"
      SECRET_KEY: "dev-secret-key-change-in-production-12345678"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/sitegenerator"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      - db
      - redis
      - backend
    networks:
      - sitegen_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sitegen_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://144.124.224.234:8000"
    depends_on:
      - backend
    networks:
      - sitegen_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:

networks:
  sitegen_network:
    driver: bridge
